services:
  # Runs migrations to completion before the app starts.
  migrate:
    build: .
    container_name: medibuddy-migrate
    command: alembic upgrade head
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/medibuddy
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    container_name: medibuddy-web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/medibuddy
      REDIS_URL: redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always

  # Scale this freely: `docker compose up -d --scale celery-worker=3`.
  celery-worker:
    build: .
    container_name: medibuddy-celery-worker
    command: celery -A app.celery_app worker --loglevel=info -Q celery
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/medibuddy
      REDIS_URL: redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always

  # Exactly one Beat process — a second one would send every reminder twice.
  celery-beat:
    build: .
    container_name: medibuddy-celery-beat
    command: celery -A app.celery_app beat --loglevel=info --schedule /app/run/celerybeat-schedule
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/medibuddy
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: medibuddy-db
    environment:
      POSTGRES_DB: medibuddy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Bound to localhost — these are development credentials.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medibuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    container_name: medibuddy-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

volumes:
  postgres_data:
